name: CI/CD Pipeline (Quality Gate & Deployment)

on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: # 支持在 GitHub Actions 界面一键手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 遵循最小特权安全原则 (参考 Mizuki 规范)
permissions:
  contents: read

jobs:
  # ==========================================
  # 阶段 1: CI 自动化质量门禁 (必须 100% 绿灯通过)
  # ==========================================
  ci-build-and-verify:
    name: 1. CI 质量门禁 (Build & Verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 10分钟超时熔断保护

    steps:
      - name: 检出仓库代码 (Checkout with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true # 支持 Git Submodule 模式 (文章/静态资源子仓库)
          fetch-depth: 0   # 完整 Git 历史记录

      - name: 安装 pnpm 包管理器 (Setup pnpm v4)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js 22 运行时与依赖缓存 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 极速安装项目依赖 (Install dependencies)
        run: pnpm install --frozen-lockfile

      - name: 校验 Prisma 数据模型语法 (Validate Prisma Schema)
        run: npx prisma validate

      - name: 生成 Prisma Client 类型声明 (Generate Prisma Client)
        run: npx prisma generate

      - name: 生产环境打包构建校验 (Nuxt 3 Build Verification)
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: "mysql://mock_user:mock_pass@localhost:3306/mock_db"
          JWT_SECRET: "ci-test-mock-jwt-secret-key-123456"
          NUXT_PUBLIC_SITE_URL: "http://localhost:3000"

  # ==========================================
  # 阶段 2: CD 生产自动部署 (严格等待阶段 1 成功后触发)
  # ==========================================
  cd-deploy-production:
    name: 2. CD 生产部署 (Deploy to Vercel)
    needs: ci-build-and-verify # 👈 必须等待 CI 阶段 1 跑完且 100% 成功！
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' # 仅在 main 分支推送时部署
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 检出仓库代码 (Checkout with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 安装 pnpm 包管理器 (Setup pnpm v4)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js 22 运行时与依赖缓存 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 极速安装项目依赖 (Install dependencies)
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client 声明 (Generate Prisma Client)
        run: npx prisma generate

      - name: 全局安装 Vercel CLI 官方工具 (Install Vercel CLI)
        run: pnpm add -g vercel@latest

      - name: 拉取 Vercel 生产环境变量 (Pull Vercel Environment)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 预编译生产制品 (Build Project Artifacts)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 发布至 Vercel 全球生产边缘网络 (Deploy to Vercel)
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "🎉 生产环境部署成功！"
          echo "🌐 线上公网访问地址: $DEPLOYMENT_URL"
