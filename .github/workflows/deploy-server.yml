name: Continuous Deployment (CD - Aliyun Server)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: # 支持在 GitHub Actions 界面一键手动点击部署

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 步骤 1: 自动将 GitHub 仓库 1 秒原生镜像同步至 Gitee (国内专线)
  sync-to-gitee:
    name: Sync Repository to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出完整仓库代码 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 极速镜像推送至 Gitee 仓库
        run: |
          echo "🚀 正在向 Gitee 推送最新镜像分支..."
          git remote add gitee "https://${{ secrets.GITEE_USER }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USER }}/mystic-garden.git"
          git push -f gitee main:main
          echo "🎉 Gitee 镜像仓库已成功同步！"

  # 步骤 2: 登录阿里云服务器，从 Gitee 国内极速拉取并热启动容器
  deploy-to-aliyun:
    name: Deploy to Aliyun Ubuntu Server
    needs: sync-to-gitee
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 远程 SSH 连接阿里云服务器并自动化部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Gitee 国内镜像已同步，开始在阿里云服务器执行极速部署..."
            echo "=================================================="
            
            # 1. 进入项目目录
            cd /app/mystic-garden || exit 1
            
            # 2. 配置/强制拉取 Gitee 国内源最新代码
            echo "📥 从 Gitee 国内源拉取最新代码 (速度 50MB/s)..."
            git remote set-url origin "https://${{ secrets.GITEE_USER }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USER }}/mystic-garden.git" || true
            git fetch origin main
            git reset --hard origin/main
            
            # 3. 构建并后台热重载容器
            echo "⚙️ 正在重新构建并热启动 Docker 容器..."
            docker compose up -d --build --remove-orphans
            
            # 4. 健康检查与状态展示
            echo "=================================================="
            echo "📊 检查容器当前运行状态:"
            echo "=================================================="
            docker compose ps
            
            echo ""
            echo "🎉 恭喜！阿里云服务器全栈服务已通过 Gitee 国内专线成功完成热更新！"
