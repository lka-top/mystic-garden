name: Build & Push Docker Image to Aliyun ACR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: # 支持在 GitHub 网页端手动点击触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image to Aliyun ACR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 高速构建并推送 Docker 镜像至 ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_IMAGE }}:latest
            ${{ secrets.ACR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出构建与推送结果
        run: |
          echo "🎉 镜像已成功构建并推送到阿里云 ACR！"
          echo "📦 生产镜像标签: ${{ secrets.ACR_IMAGE }}:latest"