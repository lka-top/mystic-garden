name: Continuous Deployment (CD - Vercel)

# ==============================================================================
# 💡 学习与手动实验专用工作流 (已关闭 push 自动触发，仅支持在网页端手动点击运行)
# ==============================================================================
on:
  workflow_dispatch: # 支持在 GitHub Actions 界面点击 "Run workflow" 手动触发运行

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库代码 (Checkout)
        uses: actions/checkout@v4

      - name: 安装 pnpm 包管理器 (Setup pnpm v4)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js 22 运行时与依赖缓存 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 极速安装项目依赖 (Install dependencies)
        run: pnpm install --frozen-lockfile

      - name: 发布至 Vercel 全球生产边缘网络 (Deploy to Vercel)
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: 输出生产部署公网访问地址
        run: |
          echo "🎉 生产环境部署成功！"
          echo "🌐 线上公网访问地址: ${{ steps.vercel-deploy.outputs.vercel-preview-url }}"
