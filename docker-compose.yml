services:
  mysql:
    image: mysql:8.0.36
    container_name: luokai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luokai_blog}
      MYSQL_USER: ${MYSQL_USER:-luokai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - luokai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-crpi-81wstmjlihs5q8t3.cn-chengdu.personal.cr.aliyuncs.com/mystic-garden/garden-backend:latest}
    container_name: luokai-blog-backend
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-luokai_blog}"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-luokai}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      NOTE_SYNC_TOKEN: ${NOTE_SYNC_TOKEN:?请在 .env 中配置 NOTE_SYNC_TOKEN}
      APP_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://mysgarden.top}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-https://mysgarden.top/uploads}
      TZ: Asia/Shanghai
    volumes:
      - /data/luokai-blog/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - luokai-network

  app:
    image: crpi-81wstmjlihs5q8t3.cn-chengdu.personal.cr.aliyuncs.com/mystic-garden/garden:latest
    container_name: luokai-blog-app
    restart: always
    expose:
      - "3000"
    environment:
      NUXT_BACKEND_URL: ${NUXT_BACKEND_URL:-http://backend:8080}
      DATABASE_URL: "mysql://${MYSQL_USER:-luokai}:${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-luokai_blog}"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      NUXT_NOTE_SYNC_TOKEN: ${NOTE_SYNC_TOKEN:?请在 .env 中配置 NOTE_SYNC_TOKEN}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-https://mysgarden.top/uploads}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
      NODE_ENV: production
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://mysgarden.top}
    volumes:
      - /data/luokai-blog/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - luokai-network

  nginx:
    image: nginx:alpine
    container_name: luokai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /data/luokai-blog/uploads:/var/www/uploads:ro
    depends_on:
      - app
      - backend
    networks:
      - luokai-network

  certbot:
    image: certbot/certbot
    container_name: luokai-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - luokai-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 60 --cleanup luokai-blog-app luokai-blog-backend
    networks:
      - luokai-network

volumes:
  mysql-data:
    name: luokai_mysql_data

networks:
  luokai-network:
    name: luokai_network
