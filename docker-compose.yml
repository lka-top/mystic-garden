services:
  mysql:
    image: mysql:8.0.36
    container_name: luokai-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-LuokaiSecureRoot2025!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luokai_blog}
      MYSQL_USER: ${MYSQL_USER:-luokai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-LuokaiSecurePass2025!}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - luokai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-LuokaiSecureRoot2025!}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: crpi-81wstmjlihs5q8t3.cn-chengdu.personal.cr.aliyuncs.com/mystic-garden/garden:latest
    container_name: luokai-blog-app
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-luokai}:${MYSQL_PASSWORD:-LuokaiSecurePass2025!}@mysql:3306/${MYSQL_DATABASE:-luokai_blog}"
      JWT_SECRET: ${JWT_SECRET:-luokai-garden-super-secret-jwt-key-2025}
      NODE_ENV: production
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://mysgarden.top}
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - luokai-network

  nginx:
    image: nginx:alpine
    container_name: luokai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - luokai-network

  certbot:
    image: certbot/certbot
    container_name: luokai-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - luokai-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 60 --cleanup luokai-blog-app
    networks:
      - luokai-network

volumes:
  mysql-data:
    name: luokai_mysql_data
  uploads-data:
    name: luokai_uploads_data

networks:
  luokai-network:
    name: luokai_network
