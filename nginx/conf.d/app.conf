# 1. HTTP 80 端口所有流量自动 301 永久重定向到 HTTPS
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 端口正式 SSL/TLS 加密服务
server {
    listen 443 ssl http2;
    server_name mysgarden.top www.mysgarden.top;

    ssl_certificate /etc/letsencrypt/live/mysgarden.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysgarden.top/privkey.pem;

    # SSL 现代安全协议与会话优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传图片位于宿主机独立持久化目录，避免经过 Nuxt 容器与应用进程。
    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location 内定义 add_header 后不会继承 server 级响应头，因此这里显式重复安全边界。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # REST API 与 SEO XML 路由直接转发至 Spring Boot 后端容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /feed.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
