# 1. HTTP 80 端口所有流量自动 301 永久重定向到 HTTPS
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 端口正式 SSL/TLS 加密服务
server {
    listen 443 ssl http2;
    server_name mysgarden.top www.mysgarden.top;

    ssl_certificate /etc/letsencrypt/live/mysgarden.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysgarden.top/privkey.pem;

    # SSL 现代安全协议与会话优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;

    # 上传图片位于宿主机独立持久化目录，避免经过 Nuxt 容器与应用进程。
    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
