# 1. HTTP 80 端口所有流量自动 301 永久重定向到 HTTPS
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 端口正式 SSL/TLS 加密服务
server {
    listen 443 ssl http2;
    server_name mysgarden.top www.mysgarden.top;

    ssl_certificate /etc/letsencrypt/live/mysgarden.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysgarden.top/privkey.pem;

    # SSL 现代安全协议与会话优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
