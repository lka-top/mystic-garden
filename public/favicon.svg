<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="garden-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#bg-grad)" />
  <rect width="64" height="64" rx="18" stroke="url(#garden-grad)" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Mystic Garden Crystal Flora Motif -->
  <g filter="url(#glow)">
    <!-- Central Petal -->
    <path d="M32 14 C32 14 24 23 24 30 C24 35 27.5 38 32 38 C36.5 38 40 35 40 30 C40 23 32 14 32 14 Z" 
          stroke="url(#garden-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Left Wing -->
    <path d="M24 25 C19 25 15 28 15 33 C15 38 20 40 26 38" 
          stroke="url(#garden-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Right Wing -->
    <path d="M40 25 C45 25 49 28 49 33 C49 38 44 40 38 38" 
          stroke="url(#garden-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Stem & Leaves -->
    <path d="M32 38 V50" stroke="url(#garden-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M32 44 C27 42 23 44 22 48 C26 49 30 46 32 44 Z" fill="url(#garden-grad)" fill-opacity="0.35" stroke="url(#garden-grad)" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M32 44 C37 42 41 44 42 48 C38 49 34 46 32 44 Z" fill="url(#garden-grad)" fill-opacity="0.35" stroke="url(#garden-grad)" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Ambient Sparkles -->
    <circle cx="20" cy="20" r="1.2" fill="#38bdf8" />
    <circle cx="44" cy="20" r="1.2" fill="#fb7185" />
    <circle cx="32" cy="11" r="1.3" fill="#38bdf8" />
  </g>
</svg>
